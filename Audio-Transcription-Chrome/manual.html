<!DOCTYPE html>
<html>
<head>
    <title>Manual Mode</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }
        h1 { font-size: 22px; margin: 0 0 10px 0; }
        #toolbar {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #clearBtn {
            background: #c62828;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        #clearBtn:hover { background: #e53935; }
        #holdBtn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        #holdBtn:hover { background: #444; }
        #holdBtn.holding {
            background: #f9a825;
            color: #111;
            border-color: #f9a825;
            font-weight: bold;
        }
        #hint {
            color: #777;
            font-size: 13px;
            margin-left: auto;
        }
        #columns {
            display: flex;
            gap: 20px;
            height: calc(100vh - 100px);
        }
        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .column.active {
            border-color: #4dd0c4;
            box-shadow: 0 0 0 2px rgba(77, 208, 196, 0.4);
        }
        .column h2 {
            font-size: 16px;
            color: #4dd0c4;
            margin: 0 0 10px 0;
            display: flex;
            justify-content: space-between;
        }
        .column h2 .key-tag {
            color: #666;
            font-size: 12px;
            font-weight: normal;
        }
        .history { color: white; font-size: 26px; line-height: 1.5; white-space: pre-wrap; }
        .current { color: #888; font-style: italic; margin-top: 8px; }

        #holdOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #holdOverlay .holdText {
            font-size: 52px;
            font-weight: bold;
            color: #f9a825;
            letter-spacing: 4px;
            animation: blink 1.1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0.25; }
        }
    </style>
</head>
<body>

<h1>Manual Mode</h1>
<div id="toolbar">
    <button id="clearBtn">Clear</button>
    <button id="holdBtn">HOLD</button>
    <span id="hint">← &nbsp;|&nbsp; → &nbsp;&nbsp;|&nbsp;&nbsp; H = Hold</span>
</div>
<div id="columns">
    <div class="column" id="leftColumn">
        <h2><span id="leftLabel">Client</span> <span class="key-tag">&larr;</span></h2>
        <div id="leftHistory" class="history"></div>
        <div id="leftCurrent" class="current"></div>
    </div>
    <div class="column" id="rightColumn">
        <h2><span id="rightLabel">LEP</span> <span class="key-tag">&rarr;</span></h2>
        <div id="rightHistory" class="history"></div>
        <div id="rightCurrent" class="current"></div>
    </div>
</div>

<div id="holdOverlay">
    <div class="holdText">EN ESPERA</div>
</div>

<script src="manual.js"></script>

</body>
</html>
