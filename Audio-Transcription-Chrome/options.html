<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Whisker</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>
    <main class="app-shell">
        <header class="app-header">
            <div class="brand">
                <img class="brand-icon" src="./icon128.png" alt="Whisker">
                <div class="brand-copy">
                    <div class="brand-title-row">
                        <h1>Whisker</h1>
                        <svg
                            class="brand-whisker-wave"
                            viewBox="0 0 100 35"
                            aria-hidden="true"
                            focusable="false"
                        >
                            <path
                                d="M0 20 H14 L19 17 L24 26 L29 11 L33 31 L39 0 L44 35 L49 14 L54 27 L60 6 L65 32 L71 15 L76 25 L82 17 L87 23 L92 20 H100"
                                vector-effect="non-scaling-stroke"
                            ></path>
                        </svg>
                    </div>
                    <p>Live Audio Transcription</p>
                </div>
            </div>
        </header>

        <section class="settings-card session-card" aria-labelledby="sessionHeading">
            <div class="card-heading">
                <div>
                    <h2 id="sessionHeading">Control de captura</h2>
                </div>
                <div id="serverStatus" class="status-pill">
                    <span id="statusDot" class="status-dot"></span>
                    Estado: Desconectado
                </div>
            </div>

            <div id="targetTabInfo" class="info-bar session-source">
                Vas a capturar: ninguna pestaña seleccionada
            </div>

            <div class="button-container">
                <button class="button button-primary" id="startCapture" type="button">
                    Iniciar captura
                </button>
                <button class="button button-secondary" id="stopCapture" type="button" disabled>
                    Detener
                </button>
            </div>
        </section>

        <section class="settings-card source-card" aria-labelledby="sourceHeading">
            <h2 id="sourceHeading" class="source-title">Entrada</h2>

            <div class="field-row source-field">
                <label for="sourceTabDropdown">Fuente a capturar</label>
                <div class="field-actions">
                    <select id="sourceTabDropdown">
                        <option value="">Elegí una pestaña</option>
                    </select>
                    <button id="refreshTabsButton" class="icon-button" type="button">
                        Actualizar lista
                    </button>
                </div>
            </div>

        </section>

        <section class="settings-card configuration-card" aria-labelledby="configurationHeading">
            <div class="card-heading">
                <div>
                    <h2 id="configurationHeading">Configuración</h2>
                </div>
                <button
                    id="configurationToggle"
                    class="collapse-toggle"
                    type="button"
                    aria-expanded="true"
                    aria-controls="configurationContent"
                    title="Colapsar configuración"
                >
                    <svg class="toggle-chevron" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 15l6-6 6 6"></path>
                    </svg>
                </button>
            </div>

            <div id="configurationContent" class="configuration-content">
                <div class="configuration-content-inner">
                    <div class="settings-list">
                <div class="field-row">
                    <label for="taskDropdown">Modo</label>
                    <select id="taskDropdown">
                        <option value="">Seleccioná un modo</option>
                        <option value="transcribe" selected>Transcribir</option>
                        <option value="translate">Traducir</option>
                        <option value="interpreter_auto">Interpreter · Automático (experimental)</option>
                        <option value="interpreter_manual">Interpreter · Manual</option>
                    </select>
                </div>

                <div class="field-row">
                    <label for="languageDropdown">Idioma</label>
                    <select id="languageDropdown">
                        <option value="" selected>Detectar automáticamente</option>
                        <option value="en">Inglés</option>
                        <option value="es">Español</option>
                    </select>
                </div>

                <div class="field-row">
                    <label for="columnOrderDropdown">Orden de columnas</label>
                    <select id="columnOrderDropdown" disabled>
                        <option value="">Elegí un modo Interpreter</option>
                    </select>
                </div>

                <div class="field-row">
                    <label for="modelSizeDropdown">Modelo</label>
                    <select id="modelSizeDropdown">
                        <option value="">Seleccioná un modelo</option>
                        <option value="tiny">Tiny</option>
                        <option value="tiny.en">Tiny (solo inglés)</option>
                        <option value="base">Base</option>
                        <option value="base.en">Base (solo inglés)</option>
                        <option value="small" selected>Small</option>
                        <option value="small.en">Small (solo inglés)</option>
                        <option value="medium">Medium</option>
                        <option value="medium.en">Medium (solo inglés)</option>
                        <option value="large-v2">Large v2</option>
                        <option value="large-v3">Large v3</option>
                    </select>
                </div>

                <fieldset class="field-group backend-field">
                    <legend>Backend</legend>
                    <div class="segmented-options" data-backend="rocm">
                        <label class="radio-option">
                            <input type="radio" name="backend" value="cpu">
                            <span>CPU</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="backend" value="cuda">
                            <span>CUDA</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="backend" value="vulkan">
                            <span>Vulkan</span>
                        </label>
                        <label class="radio-option indicator-text-active">
                            <input type="radio" name="backend" value="rocm" checked>
                            <span>ROCm</span>
                        </label>
                    </div>
                </fieldset>

                        <div class="toggle-row">
                            <div class="toggle-copy">
                                <label for="useVadCheckbox">Detección de voz</label>
                                <span>Ignora fragmentos sin voz antes de transcribir.</span>
                            </div>
                            <input type="checkbox" id="useVadCheckbox">
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div
        id="delayedTooltip"
        class="delayed-tooltip"
        role="tooltip"
        aria-hidden="true"
        hidden
    ></div>

    <script src="options.js"></script>
</body>

</html>
