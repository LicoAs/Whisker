<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Audio Transcription</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>
  <div class="header">
    <img src="./icon128.png"/>
    <h1>Audio Transcription</h1>
  </div>

  <div class="checkbox-container">
    <span>Backend:</span>

    <label>
      <input type="radio" name="backend" value="cpu">
      Faster-Whisper — CPU
    </label>

    <label>
      <input type="radio" name="backend" value="cuda">
      Faster-Whisper — CUDA
    </label>

    <label>
      <input type="radio" name="backend" value="vulkan">
      whisper.cpp — Vulkan
    </label>

    <label>
      <input type="radio" name="backend" value="rocm" checked>
      Faster-Whisper — ROCm
    </label>
  </div>

  <div class="dropdown-container">
    <label for="sourceTabDropdown">Fuente a capturar:</label>
    <select id="sourceTabDropdown">
      <option value="">-- Elegí una pestaña --</option>
    </select>
    <button id="refreshTabsButton" type="button">Actualizar lista</button>
  </div>

  <div id="targetTabInfo" class="status-container">
    Vas a capturar: (ninguna pestaña seleccionada)
  </div>

  <div id="serverStatus" class="status-container">
    <span id="statusDot" class="status-dot"></span>
    Estado: desconectado
  </div>

  <div class="button-container">
    <div class="button" id="startCapture">Start Capture</div>
    <div class="button" id="stopCapture" disabled>Stop Capture</div>
  </div>

  <div class="checkbox-container">
    <input type="checkbox" id="useVadCheckbox">
    <label for="useVadCheckbox">Use Voice Activity Detection</label>
  </div>

  <div class="dropdown-container">
    <label for="languageDropdown">Select Language:</label>
    <select id="languageDropdown">
      <option value="" selected>Automatically detect</option>
      <option value="en">English</option>
      <option value="es">Spanish</option>
    </select>
  </div>

  <div class="dropdown-container">
    <label for="taskDropdown">Select task:</label>
    <select id="taskDropdown">
      <option value="">Select Task</option>
      <option value="transcribe" selected>Transcribe</option>
      <option value="translate">Translate</option>
      <option value="interpreter_auto">Interpreter - Auto (experimental)</option>
      <option value="interpreter_manual">Interpreter - Manual</option>
    </select>
  </div>

  <div class="dropdown-container">
    <label for="columnOrderDropdown">Orden de columnas (izquierda / derecha):</label>
    <select id="columnOrderDropdown" disabled>
      <option value="">-- Elegí un modo Interpreter --</option>
    </select>
  </div>

  <div class="dropdown-container">
    <label for="modelSizeDropdown">Select Model Size (experimental):</label>
    <select id="modelSizeDropdown">
      <option value="">Select model</option>
      <option value="tiny">Tiny</option>
      <option value="tiny.en">Tiny (English-only)</option>
      <option value="base">Base</option>
      <option value="base.en">Base (English-only)</option>
      <option value="small" selected>Small</option>
      <option value="small.en">Small (English-only)</option>
      <option value="medium">Medium</option>
      <option value="medium.en">Medium (English-only)</option>
      <option value="large-v2">Large-v2</option>
      <option value="large-v3">Large-v3</option>
    </select>
  </div>

  <script src="options.js"></script>
</body>

</html>
