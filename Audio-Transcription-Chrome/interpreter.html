<!DOCTYPE html>
<html>
<head>
    <title>Interpreter Mode</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }
        h1 { font-size: 22px; margin: 0 0 10px 0; }
        #toolbar { margin-bottom: 15px; }
        #clearBtn {
            background: #c62828;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        #clearBtn:hover { background: #e53935; }
        #columns {
            display: flex;
            gap: 20px;
            height: calc(100vh - 100px);
        }
        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
        }
        .column h2 { font-size: 16px; color: #4dd0c4; margin: 0 0 10px 0; }
        .history { color: white; font-size: 26px; line-height: 1.5; white-space: pre-wrap; }
        .current { color: #888; font-style: italic; margin-top: 8px; }
    </style>
</head>
<body>

<h1>Interpreter Mode</h1>
<div id="toolbar">
    <button id="clearBtn">Clear</button>
</div>
<div id="columns">
    <div class="column">
        <h2 id="leftLabel">Izquierda</h2>
        <div id="leftHistory" class="history"></div>
        <div id="leftCurrent" class="current"></div>
    </div>
    <div class="column">
        <h2 id="rightLabel">Derecha</h2>
        <div id="rightHistory" class="history"></div>
        <div id="rightCurrent" class="current"></div>
    </div>
</div>

<script src="interpreter.js"></script>

</body>
</html>
